name: nqs_mobile
description: "NQS National ID citizen mobile app."
publish_to: 'none'

version: 1.1.16+23

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  flutter_secure_storage: ^10.3.1
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
